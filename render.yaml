services:
  - type: web
    name: cwb-foundry
    runtime: node
    plan: free
    # No rootDir: this is an npm workspaces monorepo, so `npm install` has to run at
    # the repo root for @cwb/engine, @cwb/cards and @cwb/ai to link correctly. The web
    # app itself lives in apps/web.
    buildCommand: npm install && npx prisma generate --schema=apps/web/prisma/schema.prisma && npx prisma db push --schema=apps/web/prisma/schema.prisma --accept-data-loss && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Same Supabase Postgres instance as pbandj, scoped to the cwb_foundry schema
      # (see apps/web/.env.example). Set these in the Render dashboard, not here.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Must be the EXACT SAME value as pbandj's own SESSION_SECRET: this app has no
      # login of its own, it verifies JWTs pbandj already issued (see src/lib/auth.ts).
      - key: SESSION_SECRET
        sync: false
